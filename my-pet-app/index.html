<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Pet App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-ink font-display text-mist antialiased">
    <main class="mx-auto flex min-h-screen w-full max-w-md flex-col justify-center gap-8 px-6 py-10">
      <header class="text-center">
        <h1 class="text-5xl font-bold tracking-tight sm:text-6xl">My Pet App</h1>
        <p class="mt-2 text-lg font-medium text-lemon">by Whindell B. Doroja</p>
      </header>

      <figure class="relative -rotate-2 rounded-md bg-white px-4 pb-3 pt-4 text-ink shadow-[6px_8px_0_0_rgb(0_0_0/0.35)]">
        <span aria-hidden="true" class="absolute -top-3 left-1/2 h-7 w-24 -translate-x-1/2 rotate-3 bg-lemon/85 shadow-sm"></span>

        <div id="reel" class="relative aspect-[4/3] overflow-hidden rounded-sm bg-mist">
          <div id="empty" class="absolute inset-0">
            <div class="flex h-full flex-col items-center justify-center gap-3 p-6 text-center text-lg font-medium text-ink/60">
              <svg viewBox="0 0 64 64" class="h-14 w-14 text-ink/25" fill="currentColor" aria-hidden="true">
                <ellipse cx="14" cy="28" rx="6" ry="8" />
                <ellipse cx="26" cy="16" rx="6" ry="8" />
                <ellipse cx="38" cy="16" rx="6" ry="8" />
                <ellipse cx="50" cy="28" rx="6" ry="8" />
                <path d="M32 30c-9 0-17 9-17 16 0 6 5 8 10 8 3 0 5-1 7-1s4 1 7 1c5 0 10-2 10-8 0-7-8-16-17-16z" />
              </svg>
              <span>Press Roll to meet a dog.</span>
            </div>
          </div>
          <img id="pet" alt="" class="hidden h-full w-full object-cover" />
        </div>

        <p id="caption" class="flex min-h-14 items-center justify-center font-hand text-4xl font-bold" aria-live="polite"></p>
      </figure>

      <div class="flex flex-col gap-4">
        <div>
          <label for="breed" class="mb-1.5 block text-base font-semibold">Breed</label>
          <select
            id="breed"
            disabled
            class="w-full cursor-pointer rounded-xl border-2 border-mist/30 bg-mist px-3 py-3 text-lg font-medium text-ink focus-visible:outline-4 focus-visible:outline-offset-2 focus-visible:outline-lemon disabled:opacity-60"
          >
            <option value="">Loading breeds…</option>
          </select>
        </div>

        <p id="error" role="alert" class="hidden rounded-xl bg-coral px-3 py-2 text-center font-medium text-ink"></p>

        <button
          id="roll"
          type="button"
          class="w-full rounded-2xl bg-lemon px-6 py-4 text-2xl font-bold text-ink shadow-[0_6px_0_0_#b88a00] transition-transform hover:brightness-105 focus-visible:outline-4 focus-visible:outline-offset-4 focus-visible:outline-mist active:translate-y-1 active:shadow-[0_2px_0_0_#b88a00] disabled:cursor-wait disabled:opacity-80"
        >
          Roll a pet
        </button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
