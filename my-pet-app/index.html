<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Pet App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-ink font-display text-ink antialiased">
    <main class="mx-auto flex min-h-screen max-w-md flex-col items-center justify-center px-5 py-10">
            <section class="mt-8 w-full rounded-[2rem] bg-mist p-5 shadow-[8px_8px_0_0_var(--color-lemon)]">
        <label for="breed" class="mb-1.5 block text-base font-semibold">Breed</label>
        <select
          id="breed"
          class="w-full cursor-pointer rounded-xl border-2 border-ink bg-white px-3 py-2.5 text-lg font-medium focus-visible:outline-4 focus-visible:outline-offset-2 focus-visible:outline-coral disabled:opacity-60"
        >
          <option value="">Loading breeds…</option>
        </select>
                <div
          id="reel"
          class="relative mt-5 aspect-[4/3] overflow-hidden rounded-2xl border-4 border-ink bg-white"
        >
          <div id="empty" class="absolute inset-0 grid place-items-center p-6 text-center text-xl font-medium text-ink/70">
            Press Roll to meet a dog.
          </div>
          <img id="pet" alt="" class="hidden h-full w-full object-cover" />
        </div>

        <button
          id="roll"
          type="button"
          class="mt-3 w-full rounded-2xl border-2 border-ink bg-lemon px-6 py-4 text-2xl font-bold shadow-[0_6px_0_0_var(--color-ink)] transition-transform hover:brightness-105 focus-visible:outline-4 focus-visible:outline-offset-4 focus-visible:outline-coral active:translate-y-1 active:shadow-[0_2px_0_0_var(--color-ink)] disabled:cursor-wait disabled:opacity-80"
        >
          Roll a pet
        </button>
      </section>
      <header class="text-center">
        <h1 class="text-5xl font-bold tracking-tight text-mist sm:text-6xl">My Pet App</h1>
        <p class="mt-2 text-lg font-medium text-lemon">by Whindell B. Doroja</p>
      </header>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
