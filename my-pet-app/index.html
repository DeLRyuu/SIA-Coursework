<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Pet App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-ink font-display text-ink antialiased">
    <main class="mx-auto flex min-h-screen max-w-md flex-col items-center justify-center px-5 py-10">
            <section class="mt-8 w-full rounded-[2rem] bg-mist p-5 shadow-[8px_8px_0_0_var(--color-lemon)]">
        <label for="breed" class="mb-1.5 block text-base font-semibold">Breed</label>
        <select
          id="breed"
          class="w-full cursor-pointer rounded-xl border-2 border-ink bg-white px-3 py-2.5 text-lg font-medium focus-visible:outline-4 focus-visible:outline-offset-2 focus-visible:outline-coral disabled:opacity-60"
        >
          <option value="">Any breed (surprise me)</option>
        </select>
      </section>
      <header class="text-center">
        <h1 class="text-5xl font-bold tracking-tight text-mist sm:text-6xl">My Pet App</h1>
        <p class="mt-2 text-lg font-medium text-lemon">by Whindell B. Doroja</p>
      </header>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
